    #header { padding: 12px 20px; background: #111827; border-bottom: 1px solid #1e293b; flex-shrink: 0; }

    #controls {
      display: flex; align-items: center; gap: 8px; padding: 8px 20px;

    }
    .ctrl-group { display: flex; align-items: center; gap: 5px; }

    .sep { width: 1px; height: 20px; background: #1e293b; margin: 0 4px; }
    .btn {
      padding: 4px 12px; border: 1px solid #1e293b; background: transparent;

      transition: all 0.15s; white-space: nowrap;

    .btn:hover:not(.active) { background: #1e293b; color: #cbd5e1; }
    .btn.active { background: #1d4ed8; color: #fff; border-color: #2563eb; }

    #map-wrap { flex: 1; position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 2000;
      background: #0d0f1acc; gap: 14px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #1e293b;
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 0.85rem; color: #64748b; }

    #legend {
      position: absolute; bottom: 28px; right: 10px; z-index: 1000;
      background: #111827ee; border: 1px solid #1e293b; border-radius: 8px;
      padding: 12px 14px; min-width: 190px; backdrop-filter: blur(4px);

    .legend-gradient { height: 10px; border-radius: 3px; margin-bottom: 5px; }
    .legend-ticks { display: flex; justify-content: space-between; font-size: 0.65rem; color: #64748b; }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: #111827; border: 1px solid #1e293b; border-radius: 9px;
      color: #e2e8f0; box-shadow: 0 8px 32px #0007; padding: 0;

    .leaflet-popup-tip { background: #111827; }
    .leaflet-popup-close-button { color: #64748b !important; top: 8px !important; right: 10px !important; font-size: 16px !important; }
    .p-zip { font-size: 1rem; font-weight: 700; color: #f1f5f9; }
    .p-borough { font-size: 0.72rem; color: #64748b; margin: 2px 0 10px; }
    .p-row { display: flex; justify-content: space-between; gap: 24px; margin: 4px 0; font-size: 0.78rem; }
    .p-lbl { color: #64748b; }
    .p-val { font-weight: 600; color: #e2e8f0; }
    .up { color: #34d399; font-weight: 700; }

    .leaflet-tooltip.dtt {

// Build lookup
const byZip = {};
ROWS.forEach(([zip, county, v25, v26, pct]) => {
  byZip[zip] = { zip, county, v25, v26, pct };
});

const vals26 = ROWS.map(r => r[3]);
const pcts   = ROWS.map(r => r[4]);
const minV = Math.min(...vals26), maxV = Math.max(...vals26);
const minP = Math.min(...pcts),   maxP = Math.max(...pcts);

// Borough display names
const BOROUGH = {
  'New York County': 'Manhattan',
  'Kings County':    'Brooklyn',
  'Queens County':   'Queens',
  'Bronx County':    'The Bronx',
  'Richmond County': 'Staten Island',
};

// ─── Color helpers ────────────────────────────────────────────────────────────
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t)    { return a + (b - a) * clamp(t, 0, 1); }

function multiStop(stops, t) {
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0);
      return [lerp(c0[0], c1[0], f), lerp(c0[1], c1[1], f), lerp(c0[2], c1[2], f)];
    }
  }
  return stops[stops.length - 1][1];
}

// Logarithmic normalization gives much better spread across the wide value range
const logMinV = Math.log(minV), logMaxV = Math.log(maxV);

// 7-stop palette: purple → blue → cyan → green → yellow → orange → red
const VALUE_STOPS = [
  [0.00, [88,  28, 135]],  // purple (cheapest)
  [0.16, [37,  99, 235]],  // blue
  [0.33, [6,  182, 212]],  // cyan
  [0.50, [16, 185, 129]],  // teal-green
  [0.67, [234,179,   8]],  // yellow
  [0.83, [234, 88,  12]],  // orange
  [1.00, [185, 28,  28]],  // dark red (most expensive)
];

function valueColor(v26) {
  const t = (Math.log(v26) - logMinV) / (logMaxV - logMinV);
  const [r, g, b] = multiStop(VALUE_STOPS, clamp(t, 0, 1));
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// Diverging scale: vivid red → neutral gray → vivid green
function changeColor(pct) {
  if (pct < 0) {
    const t = clamp(-pct / Math.abs(minP), 0, 1);
    // gray(100,100,100) → red(220,38,38)
    return `rgb(${Math.round(lerp(100,220,t))},${Math.round(lerp(100,38,t))},${Math.round(lerp(100,38,t))})`;
  }
  const t = clamp(pct / maxP, 0, 1);
  // gray(100,100,100) → green(22,163,74)
  return `rgb(${Math.round(lerp(100,22,t))},${Math.round(lerp(100,163,t))},${Math.round(lerp(100,74,t))})`;
}

// ─── Formatting ───────────────────────────────────────────────────────────────
function fmtMoney(n) {
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  return '$' + Math.round(n).toLocaleString();
}

  subdomains: 'abcd', maxZoom: 19,
}).addTo(leafMap);

let mode    = 'value';
let borough = 'all';
let geoLayer = null;
let geoData  = null;

// ─── Styling ──────────────────────────────────────────────────────────────────
function getZip(f) {
  const p = f.properties;
  return p.ZIPCODE || p.postalCode || p.zip || p.ZIP || p.ZCTA5CE10 || '';
}

function featureStyle(f) {
  const zip = getZip(f);
  const d   = byZip[zip];
  const vis = d && (borough === 'all' || d.county === borough);
  if (!d || !vis) return { fillColor: '#0d0f1a', weight: 0.5, opacity: 0.3, color: '#1e293b', fillOpacity: 0.12 };
  const color = mode === 'value' ? valueColor(d.v26) : changeColor(d.pct);
  return { fillColor: color, weight: 0.8, opacity: 0.7, color: '#1e293b', fillOpacity: 0.82 };
}

function onEach(f, layer) {
  const zip  = getZip(f);
  const d    = byZip[zip];
  if (!d) return;
  const hood = f.properties.PO_NAME || '';

  layer.bindTooltip(
    `<b>ZIP ${zip}</b>${hood ? ' &mdash; ' + hood : ''}<br>${BOROUGH[d.county] || d.county} &bull; ${fmtMoney(d.v26)}`,
    { sticky: true, opacity: 1, className: 'dtt' }
  );

  layer.on({
    mouseover(e) {
      const vis = borough === 'all' || d.county === borough;
      if (!vis) return;
      e.target.setStyle({ weight: 2, color: '#94a3b8', fillOpacity: 0.95 });
      e.target.bringToFront();
    },
    mouseout() { geoLayer.resetStyle(layer); },
    click(e) {
      const sign = d.pct >= 0 ? '+' : '';
      const cls  = d.pct >= 0 ? 'up' : 'dn';
      L.popup({ maxWidth: 260 })
        .setLatLng(e.latlng)
        .setContent(`
          <div class="p-zip">ZIP ${d.zip}${hood ? ' &mdash; ' + hood : ''}</div>
          <div class="p-borough">${BOROUGH[d.county] || d.county}</div>
          <div class="p-row"><span class="p-lbl">Feb 2025</span><span class="p-val">${fmtMoney(d.v25)}</span></div>
          <div class="p-row"><span class="p-lbl">Feb 2026</span><span class="p-val">${fmtMoney(d.v26)}</span></div>
          <div class="p-row"><span class="p-lbl">YoY Change</span><span class="${cls}">${sign}${d.pct.toFixed(2)}%</span></div>
        `)
        .openOn(leafMap);
    },
  });
}

function renderLayer() {
  if (geoLayer) { leafMap.removeLayer(geoLayer); }
  geoLayer = L.geoJSON(geoData, { style: featureStyle, onEachFeature: onEach }).addTo(leafMap);
  updateLegend();
}

// ─── Legend ───────────────────────────────────────────────────────────────────
function updateLegend() {
  const title = document.getElementById('leg-title');
  const bar   = document.getElementById('leg-bar');
  const lo    = document.getElementById('leg-lo');
  const mid   = document.getElementById('leg-mid');
  const hi    = document.getElementById('leg-hi');

  if (mode === 'value') {
    title.textContent = 'Feb 2026 Home Value';
    bar.style.background = 'linear-gradient(to right,rgb(88,28,135),rgb(37,99,235),rgb(6,182,212),rgb(16,185,129),rgb(234,179,8),rgb(234,88,12),rgb(185,28,28))';
    lo.textContent  = fmtMoney(minV);
    mid.textContent = fmtMoney((minV + maxV) / 2);
    hi.textContent  = fmtMoney(maxV);
  } else {
    title.textContent = 'YoY % Change';
    bar.style.background = 'linear-gradient(to right,rgb(220,38,38),rgb(160,70,70),rgb(100,100,100),rgb(60,140,80),rgb(22,163,74))';
    lo.textContent  = minP.toFixed(1) + '%';
    mid.textContent = '0%';
    hi.textContent  = '+' + maxP.toFixed(1) + '%';
  }
}

// ─── Controls ─────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('#btn-value,#btn-change').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  if (geoLayer) renderLayer();
}

const BOROUGH_BTN = {
  'all': 'btn-all', 'New York County': 'btn-manhattan', 'Kings County': 'btn-brooklyn',
  'Queens County': 'btn-queens', 'Bronx County': 'btn-bronx', 'Richmond County': 'btn-si',
};
const BOROUGH_ZOOM = {
  'New York County': [[40.680, -74.020], [40.882, -73.907]],
  'Kings County':    [[40.570, -74.042], [40.739, -73.833]],
  'Queens County':   [[40.540, -73.962], [40.800, -73.700]],
  'Bronx County':    [[40.785, -73.934], [40.915, -73.748]],
  'Richmond County': [[40.496, -74.260], [40.651, -74.034]],
};

function setBorough(b) {
  borough = b;
  Object.values(BOROUGH_BTN).forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(BOROUGH_BTN[b]).classList.add('active');
  if (geoLayer) {
    geoLayer.setStyle(featureStyle);
    if (b === 'all') {
      leafMap.flyTo([40.7128, -73.95], 11, { duration: 0.7 });
    } else {
      const [[s, w], [n, e]] = BOROUGH_ZOOM[b];
      leafMap.flyToBounds([[s, w], [n, e]], { padding: [20, 20], duration: 0.7 });
    }
  }
}

// ─── Load GeoJSON ─────────────────────────────────────────────────────────────
// Try sources in order until one succeeds
const GEO_SOURCES = [
  'https://raw.githubusercontent.com/fedhere/PUI2015_EC/master/mam1612_EC/nyc-zip-code-tabulation-areas-polygons.geojson',
  'https://data.cityofnewyork.us/api/geospatial/i8iw-xf4u?method=export&type=GeoJSON',
];

async function loadGeo() {
  for (const url of GEO_SOURCES) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const data = await r.json();
      if (data && data.features && data.features.length > 0) return data;
    } catch (_) { /* try next */ }
  }
  throw new Error('All GeoJSON sources failed');
}

loadGeo()
  .then(data => {
    geoData = data;
    document.getElementById('loading').style.display = 'none';
    renderLayer();
  })
  .catch(err => {
    document.getElementById('loading').innerHTML =
      `<div style="color:#f87171;text-align:center;max-width:320px">
        <b>Could not load ZIP boundaries</b><br>
        <small style="color:#64748b">${err.message}</small>
      </div>`;
  });
</script>
